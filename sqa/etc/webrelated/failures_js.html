 
    </tbody>
  </table>
</div>

<style>
    /* Centering wrapper */
    .table-wrapper {
    display: flex;
    justify-content: center;
    padding: 40px 0;
    }

    /* Table style */
    #link-table {
    table-layout: fixed;
    width: 90%;
    max-width: 1000px;
    border-collapse: collapse;
    font-family: Arial, sans-serif;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 8px;
    overflow: hidden;
    }

    /* Column widths */
    #link-table th:first-child,
    #link-table td:first-child {
    width: 5%;  /* Test ID */
    text-align: center;
    }
    #link-table th:nth-child(2),
    #link-table td:nth-child(2) {
    width: 60%;  /* Link */
    word-wrap: break-word;
    }
    #link-table th:last-child,
    #link-table td:last-child {
    width: 35%;  /* Comment */
    }

    /* Header */
    #link-table thead {
    background: #f5f5f5;
    }
    #link-table th {
    text-align: left;
    padding: 12px;
    font-weight: 600;
    color: #333;
    border-bottom: 2px solid #ddd;
    }

    /* Body */
    #link-table td {
    padding: 10px 12px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
    }

    /* Alternate rows */
    #link-table tbody tr:nth-child(even) {
    background: #fafafa;
    }

    /* Hover effect */
    #link-table tbody tr:hover {
    background: #f0f8ff;
    }

    /* Links */
    #link-table a {
    color: #0078d7;
    text-decoration: none;
    }
    #link-table a:hover {
    text-decoration: underline;
    }

    /* Editable comments */
    td[contenteditable="true"] {
    min-height: 20px;
    background: #fffdf7;
    border: 1px solid transparent;
    transition: border 0.2s, background 0.2s;
    overflow-wrap: break-word;
    }
    td[contenteditable="true"]:focus {
    outline: none;
    border: 1px solid #0078d7;
    background: #ffffff;
    }

    /* Copy icon */
    .copy-icon {
    width: 16px;
    height: 16px;
    cursor: pointer;
    margin-left: 6px;
    vertical-align: middle;
    fill: #666;
    transition: fill 0.2s;
    }
    .copy-icon:hover {
    fill: #000;
    }
</style>

<script>
    // ===== Copy icon =====
    const copySVG = `
    <svg xmlns="http://www.w3.org/2000/svg" class="copy-icon" viewBox="0 0 24 24">
      <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 
               .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 
               2-.9 2-2V7c0-1.1-.9-2-2-2zm0 
               16H8V7h11v14z"/>
    </svg>`;
    document.querySelectorAll("#link-table a").forEach(a => {
      const span = document.createElement("span");
      span.innerHTML = copySVG;
      const icon = span.firstElementChild;
      icon.onclick = () => {
        const text = "./sqa/bin/runTest.sh " + a.textContent.trim() + " debug";
        navigator.clipboard.writeText(text);
        icon.style.fill = "green";
        setTimeout(() => icon.style.fill = "#666", 1000);
      };
      a.insertAdjacentElement("afterend", icon);
    });

    // ===== Path + multi-version storage, keyed by checksum =====
    const pathKey = "comments:" + window.location.pathname;
    const currentVersion = document.querySelector('meta[name="file-version"]').content;
    const table = document.getElementById("link-table");

    function rowChecksum(row, indexFallback) {
      const a = row.querySelector("a");
      return a?.dataset.id || ("row-" + indexFallback);
    }

    function loadAll() {
      const savedAll = JSON.parse(localStorage.getItem(pathKey) || "{}");
      return savedAll[currentVersion] || {};
    }

    function saveAll(map) {
      const savedAll = JSON.parse(localStorage.getItem(pathKey) || "{}");
      savedAll[currentVersion] = map;
      localStorage.setItem(pathKey, JSON.stringify(savedAll));
    }

    // Load on start
    window.addEventListener("load", () => {
      const map = loadAll();
      [...table.tBodies[0].rows].forEach((row, i) => {
        const checksum = rowChecksum(row, i);
        const commentCell = row.cells[2];
        if (map[checksum]) commentCell.textContent = map[checksum];
      });
    });

    // Save on edits
    table.addEventListener("input", () => {
      const map = {};
      [...table.tBodies[0].rows].forEach((row, i) => {
        const checksum = rowChecksum(row, i);
        map[checksum] = row.cells[2].textContent.trim();
      });
      saveAll(map);
    });

    // ===== Sorting logic =====
    function sortTableByColumn(table, column, asc = true) {
      const dirModifier = asc ? 1 : -1;
      const tBody = table.tBodies[0];
      const rows = Array.from(tBody.querySelectorAll("tr"));

      const sortedRows = rows.sort((a, b) => {
        const aText = a.cells[column].textContent.trim();
        const bText = b.cells[column].textContent.trim();

        if (column === 0) {
          return (parseInt(aText, 10) - parseInt(bText, 10)) * dirModifier;
        } else {
          return aText.localeCompare(bText) * dirModifier;
        }
      });

      while (tBody.firstChild) tBody.removeChild(tBody.firstChild);
      tBody.append(...sortedRows);
    }

    // Track sort direction per column
    document.querySelectorAll("#link-table th").forEach((header, index) => {
      let asc = true;
      header.addEventListener("click", () => {
        sortTableByColumn(table, index, asc);
        asc = !asc;
      });
    });
  </script>
</body>
</html>
